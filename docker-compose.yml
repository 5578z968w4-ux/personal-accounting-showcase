services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      DEMO_MODE: ${DEMO_MODE:-0}
      APP_NAME: ${APP_NAME}
      APP_LOGIN_USERNAME: ${APP_LOGIN_USERNAME}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      API_TOKEN: ${API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html:ro
      - personal-accounting-apache-logs:/var/log/apache2
      - personal-accounting-php-logs:/var/log/php
    depends_on:
      db:
        condition: service_healthy
    networks:
      - personal-accounting

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - personal-accounting-db-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - personal-accounting

networks:
  personal-accounting:

volumes:
  personal-accounting-db-data:
  personal-accounting-apache-logs:
  personal-accounting-php-logs:
